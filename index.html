<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cebu-first pickleball court finder for the Philippines — map, filters, distance, booking, favorites and court comparison." />
  <meta property="og:title" content="PicklePH — Pickleball Courts Finder" />

  <link rel="stylesheet" href="./src/styles.css" />
